<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1560" viewBox="0 0 600 1560" role="img" aria-labelledby="t d">
  <title id="t">How Orbit Remote connects your computers</title>
  <desc id="d">Your computer's Orbit app talks to the remote computer through two encryption layers: Tailscale WireGuard and, inside it, Orbit mutual TLS. The host checks link policy, identity, permissions, and session before reaching the desktop.</desc>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f6349" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="tail" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#4f6349" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="1560" rx="22" fill="#ffffff"/>
  <text x="24" y="44" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">How a connection works</text><text x="24" y="68" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Two encryption layers, four host checks.</text><rect x="24" y="92" width="552" height="470" rx="18" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><g transform="translate(42.35483870967742 110.35483870967742) scale(0.04032258064516129)"><g fill="none" stroke="#22603f" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#22603f"/><circle cx="791.86" cy="337.13" r="40" fill="#22603f"/></g><text x="90" y="128" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.4">YOUR COMPUTER</text><text x="90" y="148" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Viewer</text><rect x="44" y="176" width="512" height="92" rx="12" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><text x="62" y="208" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Orbit window</text><text x="62" y="232" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Sandboxed. Never holds keys</text><text x="62" y="252" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">or sockets.</text><line x1="300.0" y1="272" x2="300.0" y2="314" stroke="#4f6349" stroke-width="2" marker-end="url(#head)"/><text x="310.0" y="298" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">allow-listed actions</text><rect x="44" y="318" width="512" height="112" rx="12" fill="#ffffff" stroke="#22603f" stroke-width="2"/><text x="62" y="350" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Orbit main process</text><text x="62" y="374" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Holds this computer's key</text><text x="62" y="394" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Checks the host's pin + cipher</text><text x="62" y="414" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">before sending one byte</text><rect x="44" y="452" width="512" height="88" rx="12" fill="#f6ecd2" stroke="#86651a" stroke-width="1.5"/><text x="62" y="480" fill="#86651a" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.3">SECURITY CODE</text><text x="62" y="504" fill="#1f2d23" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">551F 68EA 65A3 120A …</text><text x="62" y="526" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Matches on both computers</text><line x1="300" y1="566" x2="300" y2="600" stroke="#4f6349" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="24" y="606" width="552" height="252" rx="26" fill="#e3ecfb" stroke="#2b5aa6" stroke-width="2" stroke-dasharray="7 6"/><g fill="none" stroke="#2b5aa6" stroke-width="2" stroke-linecap="round"><rect x="46" y="631" width="14" height="11" rx="2.5"/><path d="M49.5 631V628.5a3.5 3.5 0 0 1 7 0V631"/></g><text x="70" y="640" fill="#2b5aa6" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="1.2">LAYER 1 · TAILSCALE WIREGUARD</text><text x="46" y="664" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Only your tailnet devices can reach the host.</text><text x="46" y="683" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Curve25519 · ChaCha20-Poly1305 · relays see ciphertext</text><rect x="42" y="704" width="516" height="136" rx="20" fill="#dff0e4" stroke="#22603f" stroke-width="2"/><g fill="none" stroke="#22603f" stroke-width="2" stroke-linecap="round"><rect x="60" y="727" width="14" height="11" rx="2.5"/><path d="M63.5 727V724.5a3.5 3.5 0 0 1 7 0V727"/></g><text x="84" y="736" fill="#22603f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="1.2">LAYER 2 · ORBIT MUTUAL TLS</text><text x="60" y="762" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">TLS 1.3 · AES-256-GCM · X25519</text><text x="60" y="784" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Forward secrecy. Weaker links refused</text><text x="60" y="803" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">by both sides. Certificates pinned.</text><line x1="300" y1="862" x2="300" y2="896" stroke="#4f6349" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="24" y="902" width="552" height="470" rx="18" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><g transform="translate(42.35483870967742 920.3548387096774) scale(0.04032258064516129)"><g fill="none" stroke="#22603f" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#22603f"/><circle cx="791.86" cy="337.13" r="40" fill="#22603f"/></g><text x="90" y="938" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.4">REMOTE COMPUTER</text><text x="90" y="958" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Host</text><rect x="44" y="984" width="512" height="60" rx="12" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="70" cy="1014" r="14" fill="#22603f"/><text x="70" y="1019" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="96" y="1010" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Link policy</text><text x="96" y="1030" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Weak TLS dropped first</text><rect x="44" y="1054" width="512" height="60" rx="12" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="70" cy="1084" r="14" fill="#22603f"/><text x="70" y="1089" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="96" y="1080" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Identity</text><text x="96" y="1100" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Pinned certificate + tailnet source</text><rect x="44" y="1124" width="512" height="60" rx="12" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="70" cy="1154" r="14" fill="#22603f"/><text x="70" y="1159" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="96" y="1150" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Permissions</text><text x="96" y="1170" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Only what the owner granted</text><rect x="44" y="1194" width="512" height="60" rx="12" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="70" cy="1224" r="14" fill="#22603f"/><text x="70" y="1229" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="96" y="1220" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Session</text><text x="96" y="1240" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">One controller · revocable</text><line x1="300.0" y1="1258" x2="300.0" y2="1278" stroke="#4f6349" stroke-width="2" marker-end="url(#head)"/><rect x="44" y="1282" width="512" height="72" rx="12" fill="#dff0e4" stroke="#22603f" stroke-width="1.5"/><text x="62" y="1310" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Your existing desktop</text><text x="62" y="1332" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Screen · input · clipboard · files</text><rect x="24" y="1396" width="552" height="40" rx="20" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="46" cy="1416" r="5" fill="#22603f"/><text x="60" y="1421" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">No Orbit server or account</text><rect x="24" y="1448" width="552" height="40" rx="20" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="46" cy="1468" r="5" fill="#22603f"/><text x="60" y="1473" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Encrypted twice, end to end</text><rect x="24" y="1500" width="552" height="40" rx="20" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="46" cy="1520" r="5" fill="#22603f"/><text x="60" y="1525" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Your grants, your revocation</text>
</svg>
