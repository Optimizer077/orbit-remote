<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" role="img" aria-labelledby="t d">
  <title id="t">Orbit Remote session lifecycle</title>
  <desc id="d">A paired device moves to Live viewing with Connect or View only. Take control, if the host granted Control, moves to Controlling; Esc returns to Live. A network drop from either state moves to Reconnecting, which keeps the last frame dimmed and retries with backoff, then returns to Live. Disconnect, Disconnect all or a host stop ends the session with HTTP 410 and it is never resumed automatically. If the owner revokes the device, the session ends with HTTP 401 and access is removed.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="516" rx="22" fill="#101616"/>
  <text x="36" y="48" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Session lifecycle</text><text x="36" y="74" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">What a connection goes through, and what ends it for good.</text><rect x="352" y="104" width="508" height="342" rx="22" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><text x="374" y="134" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">ACTIVE SESSION</text><text x="838" y="134" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="end">Exits apply to both states</text><rect x="374" y="150" width="176" height="274" rx="16" fill="#1d2b23" stroke="#b2e6c5" stroke-width="2"/><g transform="translate(445 220) scale(1.4167)" fill="none" stroke="#b2e6c5" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></g><text x="462" y="284" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Live</text><text x="462" y="304" fill="#b2e6c5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">viewing</text><text x="462" y="330" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">You watch the</text><text x="462" y="350" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">host's screen.</text><rect x="662" y="150" width="176" height="274" rx="16" fill="#1d2b23" stroke="#aecaff" stroke-width="2"/><g transform="translate(733 200) scale(1.4167)" fill="none" stroke="#aecaff" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 6.5v3.5"/></g><text x="750" y="264" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Controlling</text><text x="750" y="290" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Your mouse and</text><text x="750" y="310" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">keyboard drive</text><text x="750" y="330" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">the host.</text><text x="750" y="350" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">One controller</text><text x="750" y="370" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">at a time.</text><rect x="36" y="150" width="204" height="112" rx="16" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(54 167) scale(0.9167)" fill="none" stroke="#a3b398" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></g><text x="86" y="186" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Paired</text><text x="56" y="210" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Pin and grants</text><text x="56" y="230" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">stored on the host.</text><rect x="36" y="300" width="204" height="124" rx="16" fill="#1d2b23" stroke="#e3cd8f" stroke-width="2"/><g transform="translate(54 317) scale(0.9167)" fill="none" stroke="#e3cd8f" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20.2 3.8v4.7h-4.7"/></g><text x="86" y="336" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Reconnecting</text><text x="56" y="360" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Keeps the last frame</text><text x="56" y="380" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">dimmed and retries</text><text x="56" y="400" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">with backoff.</text><rect x="972" y="150" width="192" height="120" rx="16" fill="#1d2b23" stroke="#a3b398" stroke-width="2"/><rect x="977" y="155" width="182" height="110" rx="12" fill="none" stroke="#a3b398" stroke-width="1.2"/><g transform="translate(990 167) scale(0.9167)" fill="none" stroke="#a3b398" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><rect x="9" y="9" width="6" height="6" rx="1"/></g><text x="1022" y="186" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Ended</text><rect x="992" y="200" width="85" height="24" rx="12.0" fill="#16211c" stroke="#a3b398" stroke-width="1.2"/><text x="1004" y="216.5" fill="#a3b398" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">HTTP 410</text><text x="992" y="248" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Never auto-resumed.</text><rect x="972" y="304" width="192" height="120" rx="16" fill="#1d2b23" stroke="#f2b0a6" stroke-width="2"/><rect x="977" y="309" width="182" height="110" rx="12" fill="none" stroke="#f2b0a6" stroke-width="1.2"/><g transform="translate(990 321) scale(0.9167)" fill="none" stroke="#f2b0a6" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></g><text x="1022" y="340" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Revoked</text><rect x="992" y="354" width="85" height="24" rx="12.0" fill="#16211c" stroke="#f2b0a6" stroke-width="1.2"/><text x="1004" y="370.5" fill="#f2b0a6" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">HTTP 401</text><text x="992" y="402" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Access removed.</text><line x1="240" y1="206" x2="374" y2="206" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><text x="296" y="184" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Connect or</text><text x="296" y="199" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">View only</text><line x1="374" y1="340" x2="240" y2="340" stroke="#e3cd8f" stroke-width="2" stroke-linecap="round" marker-end="url(#h-gold)"/><text x="296" y="314" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">network drop</text><text x="296" y="329" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">either state</text><line x1="240" y1="392" x2="374" y2="392" stroke="#b2e6c5" stroke-width="2" stroke-linecap="round" marker-end="url(#h-mint)"/><text x="296" y="413" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">reconnected</text><text x="296" y="428" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">back to Live</text><line x1="550" y1="236" x2="662" y2="236" stroke="#aecaff" stroke-width="2" stroke-linecap="round" marker-end="url(#h-blue)"/><text x="606" y="224" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Take control</text><text x="606" y="257" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">if the host</text><text x="606" y="272" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">granted Control</text><line x1="662" y1="352" x2="550" y2="352" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><rect x="585.562" y="316" width="40.875" height="24" rx="6" fill="#1d2b23" stroke="#a3b398" stroke-width="1.3"/><line x1="588.562" y1="340" x2="623.438" y2="340" stroke="#a3b398" stroke-width="2.5" stroke-linecap="round"/><text x="606" y="332.5" fill="#eceee7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="middle">Esc</text><text x="606" y="374" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">back to Live</text><line x1="860" y1="210" x2="972" y2="210" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><text x="916" y="184" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Disconnect,</text><text x="916" y="199" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Disconnect all</text><text x="916" y="229" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">or host stop</text><line x1="860" y1="364" x2="972" y2="364" stroke="#f2b0a6" stroke-width="2" stroke-linecap="round" marker-end="url(#h-rose)"/><text x="916" y="352" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">owner revokes</text><text x="916" y="382" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">any time</text><rect x="36" y="473" width="26" height="18" rx="5" fill="#1d2b23" stroke="#33463a" stroke-width="1.3"/><text x="72" y="486.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">State</text><rect x="136.375" y="473" width="26" height="18" rx="5" fill="#1d2b23" stroke="#a3b398" stroke-width="1.3"/><rect x="139.375" y="476" width="20" height="12" rx="3" fill="none" stroke="#a3b398" stroke-width="1"/><text x="172.375" y="486.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Final state: not resumed automatically</text><line x1="463.625" y1="482" x2="489.625" y2="482" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><text x="499.625" y="486.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Event that changes the state</text>
</svg>
