<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="797" viewBox="0 0 1200 797" role="img" aria-labelledby="t d">
  <title id="t">Pairing two Orbit Remote computers</title>
  <desc id="d">Pairing happens once per direction. 1: on the host, choose Invite a computer and pick its grants; view only is the default. 2: the host creates an invitation with its address, certificate fingerprint and a one-time secret; it expires in 5 minutes and works once. 3: you send it privately to the viewer. 4: the viewer chooses Join with an invite, pastes it, connects, and checks that the host certificate matches the fingerprint before sending the secret. 5: the host verifies the secret and stores the viewer's certificate pin and grants. 6: both screens show the same security code, compared once. If an invitation leaks and someone else pairs first, the codes will not match.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="797" rx="22" fill="#101616"/>
  <text x="36" y="48" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Pairing: once per direction</text><text x="36" y="74" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Do this once for each computer you want to view. Viewing the other way needs its own invitation.</text><line x1="246" y1="166" x2="246" y2="549" stroke="#33463a" stroke-width="2" stroke-dasharray="2 7"/><rect x="36" y="100" width="420" height="66" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(50.35 112.35) scale(0.04032)"><g fill="none" stroke="#2dd4bf" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#2dd4bf"/><circle cx="791.86" cy="337.13" r="40" fill="#2dd4bf"/></g><text x="98" y="128" fill="#2dd4bf" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">HOST</text><text x="98" y="151" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">The computer you will view</text><line x1="954" y1="166" x2="954" y2="549" stroke="#33463a" stroke-width="2" stroke-dasharray="2 7"/><rect x="744" y="100" width="420" height="66" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(758.35 112.35) scale(0.04032)"><g fill="none" stroke="#aecaff" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#aecaff"/><circle cx="791.86" cy="337.13" r="40" fill="#aecaff"/></g><text x="806" y="128" fill="#aecaff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">VIEWER</text><text x="806" y="151" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">The computer you sit at</text><rect x="36" y="188" width="420" height="75" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="66" cy="216" r="14" fill="#2dd4bf"/><text x="66" y="221" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="94" y="221" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Invite a computer</text><text x="94" y="245" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Pick its grants. View only is the default.</text><rect x="36" y="279" width="420" height="135" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="66" cy="307" r="14" fill="#2dd4bf"/><text x="66" y="312" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="94" y="312" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Create an invitation</text><text x="94" y="336" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Holds the host address, certificate</text><text x="94" y="356" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">fingerprint and a one-time secret.</text><rect x="94" y="370" width="285.25" height="26" rx="13.0" fill="#3a321b" stroke="#e3cd8f" stroke-width="1.2"/><g transform="translate(104 375) scale(0.6667)" fill="none" stroke="#e3cd8f" stroke-width="2.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g><text x="128" y="387.5" fill="#e3cd8f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Expires in 5 minutes · works once</text><rect x="744" y="361" width="420" height="115" rx="14" fill="#1d2b23" stroke="#aecaff" stroke-width="2"/><circle cx="774" cy="389" r="14" fill="#aecaff"/><text x="774" y="394" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="802" y="394" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Join with an invite</text><text x="802" y="418" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Connects and checks the host</text><text x="802" y="438" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">certificate against the fingerprint.</text><text x="802" y="458" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">The secret is sent only after they match.</text><rect x="36" y="430" width="420" height="95" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="66" cy="458" r="14" fill="#2dd4bf"/><text x="66" y="463" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="94" y="463" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Verify and remember</text><text x="94" y="487" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Checks the secret, then stores the</text><text x="94" y="507" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">viewer's certificate pin and its grants.</text><line x1="456" y1="389" x2="744" y2="389" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><rect x="489.83" y="372" width="220.34" height="34" rx="17" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="515.83" cy="389" r="12" fill="#a3b398"/><text x="515.83" y="394" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="535.83" y="394" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start">You send it privately</text><line x1="744" y1="458" x2="456" y2="458" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" marker-end="url(#h-mint)"/><rect x="485.29" y="441" width="229.42" height="34" rx="17" fill="#16211c" stroke="#2dd4bf" stroke-width="1.5"/><g transform="translate(499.29 449) scale(0.7500)" fill="none" stroke="#2dd4bf" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></g><text x="525.29" y="463" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start">Secret, over pinned TLS</text><rect x="36" y="549" width="1128" height="146" rx="16" fill="#3a321b" stroke="#e3cd8f" stroke-width="1.5"/><circle cx="66" cy="579" r="14" fill="#e3cd8f"/><text x="66" y="584" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="94" y="584" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Compare the security code once</text><text x="94" y="606" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Both screens show the same code.</text><rect x="56" y="627" width="380" height="48" rx="12" fill="#1d2b23" stroke="#e3cd8f" stroke-width="1.2"/><text x="74" y="656" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">HOST SHOWS</text><text x="418" y="657" fill="#eceee7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="end">551F 68EA 65A3 120A …</text><rect x="764" y="627" width="380" height="48" rx="12" fill="#1d2b23" stroke="#e3cd8f" stroke-width="1.2"/><text x="782" y="656" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">VIEWER SHOWS</text><text x="1126" y="657" fill="#eceee7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="end">551F 68EA 65A3 120A …</text><text x="600" y="660" fill="#e3cd8f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">=</text><rect x="36" y="711" width="1128" height="54" rx="14" fill="#3a2321" stroke="#f2b0a6" stroke-width="1.5"/><g transform="translate(54 726) scale(1.0000)" fill="none" stroke="#f2b0a6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.01"/></g><text x="90" y="743" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="start"><tspan fill="#eceee7" font-weight="700">Swapped invite? </tspan><tspan fill="#eceee7" font-weight="400">If its host details were changed, the codes won't match.</tspan></text>
</svg>
