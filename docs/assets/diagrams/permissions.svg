<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="t d">
  <title id="t">Orbit Remote device permissions</title>
  <desc id="d">Five grants a host owner can give a paired device: View, the default for new invitations; Control of mouse and keyboard; Clipboard; Files; and Power to lock or restart. Rules: Control also needs Take control on the viewer; Power requires Control and the host's setting; Files are limited to one shared folder, 32 MiB and no overwrite; the host owner can revoke access at any time.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="448" rx="22" fill="#101616"/>
  <text x="36" y="48" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">What a paired device can do</text><text x="36" y="74" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">The host owner chooses grants for each device. New invitations start view-only.</text><rect x="36" y="104" width="212.8" height="180" rx="18" fill="#16211c" stroke="#2dd4bf" stroke-width="2"/><rect x="56" y="124" width="52" height="52" rx="14" fill="#0c463f" stroke="#2dd4bf" stroke-width="1.5"/><g transform="translate(68 136) scale(1.1667)" fill="none" stroke="#2dd4bf" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text x="56" y="206" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">View</text><text x="56" y="230" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">See the host's</text><text x="56" y="250" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">screen live.</text><rect x="150" y="124" width="78.8" height="24" rx="12" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1"/><text x="189.4" y="140.5" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">DEFAULT</text><rect x="264.8" y="104" width="212.8" height="180" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="284.8" y="124" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(296.8 136) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 6.5v3.5"/></g><text x="284.8" y="206" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Control</text><text x="284.8" y="230" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Use the host's</text><text x="284.8" y="250" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">mouse and keyboard.</text><rect x="493.6" y="104" width="212.8" height="180" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="513.6" y="124" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(525.6 136) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="17" rx="2.5"/><rect x="8.5" y="2.5" width="7" height="4" rx="1.5"/><path d="M8.5 11.5h7M8.5 15.5h4.5"/></g><text x="513.6" y="206" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Clipboard</text><text x="513.6" y="230" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Copy and paste between</text><text x="513.6" y="250" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">the two computers.</text><rect x="722.4" y="104" width="212.8" height="180" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="742.4" y="124" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(754.4 136) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><text x="742.4" y="206" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Files</text><text x="742.4" y="230" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Move files through</text><text x="742.4" y="250" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">one shared folder.</text><rect x="951.2" y="104" width="212.8" height="180" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="971.2" y="124" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(983.2 136) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8.5"/><path d="M7.2 6.4a7.6 7.6 0 1 0 9.6 0"/></g><text x="971.2" y="206" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Power</text><text x="971.2" y="230" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Lock or restart</text><text x="971.2" y="250" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">the host.</text><text x="36" y="326" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">RULES</text><rect x="36" y="340" width="270" height="76" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(52 355) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></g><text x="86" y="368" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Control also needs</text><text x="86" y="388" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Take control on the viewer.</text><rect x="322" y="340" width="270" height="76" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(338 355) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8.5"/><path d="M7.2 6.4a7.6 7.6 0 1 0 9.6 0"/></g><text x="372" y="368" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Power requires Control</text><text x="372" y="388" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">and the host's setting.</text><rect x="608" y="340" width="270" height="76" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(624 355) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><text x="658" y="368" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Files: one shared folder,</text><text x="658" y="388" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">32 MiB limit, no overwrite.</text><rect x="894" y="340" width="270" height="76" rx="14" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(910 355) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></g><text x="944" y="368" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">The host owner can revoke</text><text x="944" y="388" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">access at any time.</text>
</svg>
