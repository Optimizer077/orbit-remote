al, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">TLS 1.3 · both sides pinned</text><text x="488" y="635" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Mutual TLS inside WireGuard</text><text x="488" y="655" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">to B's host port 47832</text><path d="M396 371 C600 371 600 605 804 605" fill="none" stroke="#b2e6c5" stroke-width="2.5" marker-end="url(#h-mint)"/><rect x="36" y="716" width="463.237" height="40" rx="20" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="58" cy="736" r="5" fill="#b2e6c5"/><text x="72" y="741" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Every installation is both a viewer and a host</text><rect x="513.237" y="716" width="322.297" height="40" rx="20" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="535.237" cy="736" r="5" fill="#b2e6c5"/><text x="549.237" y="741" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Admin API stays on 127.0.0.1</text><rect x="849.533" y="716" width="314.467" height="40" rx="20" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="871.533" cy="736" r="5" fill="#b2e6c5"/><text x="885.533" y="741" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">The window never holds keys</text>
