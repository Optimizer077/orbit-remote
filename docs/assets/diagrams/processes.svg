e UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Sandboxed renderer.</text><text x="852" y="260" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">No Node.js, no keys.</text><line x1="974" y1="284" x2="974" y2="318" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)" marker-start="url(#t-muted)"/><text x="986" y="306" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">allow-listed IPC</text><rect x="804" y="324" width="340" height="94" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(820 339) scale(0.9167)" fill="none" stroke="#a3b398" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"/></g><text x="852" y="356" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Orbit main process</text><text x="852" y="380" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">TLS client. Checks the pin and link</text><text x="852" y="400" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">policy, and supervises the host.</text><line x1="974" y1="423" x2="974" y2="443" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)" marker-start="url(#t-muted)"/><rect x="804" y="448" width="340" height="60" rx="12" fill="#16211c" stroke="#33463a" stroke-width="1.5