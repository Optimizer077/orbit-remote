<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img" aria-labelledby="t d">
  <title id="t">Orbit Remote processes on each computer</title>
  <desc id="d">Each computer runs the same parts: the sandboxed Orbit window with no Node.js and no keys, connected by allow-listed IPC to the Orbit main process, which is the TLS client, checks the pin and policy and supervises the host; the local admin API on 127.0.0.1:47831 with a bearer token; and the .NET Orbit host for capture, input, clipboard, files, permissions and audit, listening only on the Tailscale IP at port 47832. Computer A's main process reaches computer B's host through mutual TLS inside WireGuard. Every installation is both a viewer and a host.</desc>
