<svg xmlns="http://www.w3.org/2000/svg" width="600" height="988" viewBox="0 0 600 988" role="img" aria-labelledby="t d">
  <title id="t">Orbit Remote session lifecycle</title>
  <desc id="d">A paired device moves to Live viewing with Connect or View only. Take control, if the host granted Control, moves to Controlling; Esc returns to Live. A network drop from either state moves to Reconnecting, which keeps the last frame dimmed and retries with backoff, then returns to Live. Disconnect, Disconnect all or a host stop ends the session with HTTP 410 and it is never resumed automatically. If the owner revokes the device, the session ends with HTTP 401 and access is removed.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="988" rx="22" fill="#101616"/>
  <text x="24" y="44" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Session lifecycle</text><text x="24" y="70" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">What a connection goes through, and what</text><text x="24" y="90" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">ends it for good.</text><rect x="24" y="116" width="264" height="116" rx="16" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(42 133) scale(0.9167)" fill="none" stroke="#a3b398" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></g><text x="74" y="152" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Paired</text><text x="44" y="176" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Pin and grants</text><text x="44" y="197" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">stored on the host.</text><rect x="312" y="116" width="264" height="116" rx="16" fill="#1d2b23" stroke="#e3cd8f" stroke-width="2"/><g transform="translate(330 133) scale(0.9167)" fill="none" stroke="#e3cd8f" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20.2 3.8v4.7h-4.7"/></g><text x="362" y="152" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Reconnecting</text><text x="332" y="176" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Keeps the last frame dimmed</text><text x="332" y="197" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">and retries with backoff.</text><rect x="24" y="306" width="552" height="396" rx="22" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><text x="44" y="336" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">ACTIVE SESSION</text><text x="44" y="684" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Exits apply to both states</text><rect x="44" y="352" width="512" height="96" rx="16" fill="#1d2b23" stroke="#b2e6c5" stroke-width="2"/><g transform="translate(62 369) scale(0.9167)" fill="none" stroke="#b2e6c5" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></g><text x="94" y="388" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Live (viewing)</text><text x="64" y="412" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">You watch the host's screen.</text><rect x="44" y="540" width="512" height="118" rx="16" fill="#1d2b23" stroke="#aecaff" stroke-width="2"/><g transform="translate(62 557) scale(0.9167)" fill="none" stroke="#aecaff" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 6.5v3.5"/></g><text x="94" y="576" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Controlling</text><text x="64" y="600" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Your mouse and keyboard drive the host.</text><text x="64" y="621" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">One controller at a time.</text><line x1="200" y1="232" x2="200" y2="352" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><text x="190" y="264" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">Connect or</text><text x="190" y="279" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">View only</text><line x1="400" y1="352" x2="400" y2="232" stroke="#e3cd8f" stroke-width="2" stroke-linecap="round" marker-end="url(#h-gold)"/><text x="390" y="264" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">network drop</text><text x="390" y="279" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end">either state</text><line x1="476" y1="232" x2="476" y2="352" stroke="#b2e6c5" stroke-width="2" stroke-linecap="round" marker-end="url(#h-mint)"/><text x="488" y="264" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">reconnected</text><text x="488" y="279" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">back to Live</text><line x1="300" y1="448" x2="300" y2="540" stroke="#aecaff" stroke-width="2" stroke-linecap="round" marker-end="url(#h-blue)"/><text x="314" y="490" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Take control</text><text x="314" y="508" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">if the host granted Control</text><line x1="240" y1="540" x2="240" y2="448" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><rect x="185.562" y="474" width="40.875" height="24" rx="6" fill="#1d2b23" stroke="#a3b398" stroke-width="1.3"/><line x1="188.562" y1="498" x2="223.438" y2="498" stroke="#a3b398" stroke-width="2.5" stroke-linecap="round"/><text x="206" y="490.5" fill="#eceee7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="middle">Esc</text><text x="228" y="516" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end">back to Live</text><line x1="150" y1="702" x2="150" y2="782" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><text x="162" y="724" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Disconnect,</text><text x="162" y="739" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Disconnect all</text><text x="162" y="754" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">or host stop</text><line x1="438" y1="702" x2="438" y2="782" stroke="#f2b0a6" stroke-width="2" stroke-linecap="round" marker-end="url(#h-rose)"/><text x="450" y="732" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">owner revokes</text><text x="450" y="747" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">any time</text><rect x="24" y="782" width="264" height="122" rx="16" fill="#1d2b23" stroke="#a3b398" stroke-width="2"/><rect x="29" y="787" width="254" height="112" rx="12" fill="none" stroke="#a3b398" stroke-width="1.2"/><g transform="translate(42 799) scale(0.9167)" fill="none" stroke="#a3b398" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><rect x="9" y="9" width="6" height="6" rx="1"/></g><text x="74" y="818" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Ended</text><rect x="44" y="832" width="85" height="24" rx="12.0" fill="#16211c" stroke="#a3b398" stroke-width="1.2"/><text x="56" y="848.5" fill="#a3b398" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">HTTP 410</text><text x="44" y="880" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Never auto-resumed.</text><rect x="312" y="782" width="264" height="122" rx="16" fill="#1d2b23" stroke="#f2b0a6" stroke-width="2"/><rect x="317" y="787" width="254" height="112" rx="12" fill="none" stroke="#f2b0a6" stroke-width="1.2"/><g transform="translate(330 799) scale(0.9167)" fill="none" stroke="#f2b0a6" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></g><text x="362" y="818" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Revoked</text><rect x="332" y="832" width="85" height="24" rx="12.0" fill="#16211c" stroke="#f2b0a6" stroke-width="1.2"/><text x="344" y="848.5" fill="#f2b0a6" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">HTTP 401</text><text x="332" y="880" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Access removed.</text><rect x="24" y="927" width="26" height="18" rx="5" fill="#1d2b23" stroke="#33463a" stroke-width="1.3"/><text x="60" y="940.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">State</text><line x1="124.375" y1="936" x2="150.375" y2="936" stroke="#a3b398" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><text x="160.375" y="940.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Event that changes the state</text><rect x="24" y="953" width="26" height="18" rx="5" fill="#1d2b23" stroke="#a3b398" stroke-width="1.3"/><rect x="27" y="956" width="20" height="12" rx="3" fill="none" stroke="#a3b398" stroke-width="1"/><text x="60" y="966.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Final state: not resumed automatically</text>
</svg>
