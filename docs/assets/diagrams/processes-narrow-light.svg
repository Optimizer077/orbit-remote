 y="862" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Mutual TLS inside WireGuard</text><text x="56" y="882" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A's main process → B's host port 47832</text><rect x="24" y="940" width="552" height="574" rx="18" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><g transform="translate(42.35 958.35) scale(0.04032)"><g fill="none" stroke="#22603f" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#22603f"/><circle cx="791.86" cy="337.13" r="40" fill="#22603f"/></g><text x="90" y="976" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">COMPUTER B</text><text x="90" y="996" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Being viewed</text><rect x="44" y="1024" width="476" height="74" rx="12" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><g transform="translate(60 1039) scale(0.9167)" fill="none" stroke="#4f6349" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M2.5 8.5h19M5.8 6.3h.01M8.4 6.3h.01"/></g><text x="92" y="1056" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" text-anchor="start">Orbit window</text><text x="92" y="1080" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start