<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d">
  <title id="t">Orbit Remote encryption layers</title>
  <desc id="d">Nested layers from outside in: the Tailscale network boundary, where only your tailnet devices reach port 47832; layer 1, WireGuard with Curve25519 and ChaCha20-Poly1305; layer 2, Orbit mutual TLS with TLS 1.3, AES-256-GCM and X25519, or TLS 1.2 with ECDHE and AEAD, weaker settings refused by both sides, with forward secrecy; identity, pinned RSA-3072 certificates with a SHA-256 pin and a security code; and at the centre your screen, keystrokes, clipboard and files. At rest, identity keys are protected by Windows DPAPI or by user-only files on macOS and Linux, with keychain support planned. Limits: not post-quantum in practice, does not protect a compromised computer, no independent audit yet.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="730" rx="22" fill="#101616"/>
  <text x="36" y="48" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Encryption in layers</text><text x="36" y="74" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Your session is wrapped twice, and each side proves who it is with a pinned certificate.</text><rect x="36" y="100" width="784" height="522" rx="26" fill="#16211c" stroke="#33463a" stroke-width="1.8" stroke-dasharray="2 6"/><g transform="translate(54 115) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3z"/></g><text x="82" y="131" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">TAILSCALE NETWORK BOUNDARY</text><text x="54" y="158" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Only your tailnet devices can reach port 47832.</text><rect x="56" y="180" width="744" height="424" rx="23" fill="#16233a" stroke="#aecaff" stroke-width="2" stroke-dasharray="7 6"/><g transform="translate(74 195) scale(0.8333)" fill="none" stroke="#aecaff" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></g><text x="102" y="211" fill="#aecaff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">LAYER 1 · WIREGUARD</text><text x="74" y="238" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Curve25519 · ChaCha20-Poly1305</text><rect x="76" y="260" width="704" height="326" rx="20" fill="#0c463f" stroke="#2dd4bf" stroke-width="2"/><g transform="translate(94 275) scale(0.8333)" fill="none" stroke="#2dd4bf" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></g><text x="122" y="291" fill="#2dd4bf" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">LAYER 2 · ORBIT MUTUAL TLS</text><text x="94" y="318" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">TLS 1.3 · AES-256-GCM · X25519</text><text x="94" y="340" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Or TLS 1.2 with ECDHE + AEAD. Anything weaker is refused by both sides.</text><text x="94" y="360" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Forward secrecy protects past sessions.</text><rect x="96" y="382" width="664" height="186" rx="17" fill="#3a321b" stroke="#e3cd8f" stroke-width="2"/><g transform="translate(114 397) scale(0.8333)" fill="none" stroke="#e3cd8f" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.8 12.2L20 3M16.5 6.5l3 3"/></g><text x="142" y="413" fill="#e3cd8f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">IDENTITY</text><text x="114" y="440" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Pinned RSA-3072 certificates · SHA-256 pin</text><text x="114" y="462" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Both screens show the same security code at pairing.</text><rect x="116" y="484" width="624" height="66" rx="14" fill="#1d2b23" stroke="#eceee7" stroke-width="1.5"/><g transform="translate(136 505) scale(1.0000)" fill="none" stroke="#eceee7" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></g><text x="172" y="523" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Your screen, keystrokes, clipboard, files</text><rect x="852" y="100" width="312" height="292" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(874 122) scale(1.0000)" fill="none" stroke="#e3cd8f" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.8 12.2L20 3M16.5 6.5l3 3"/></g><text x="910" y="134" fill="#e3cd8f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">AT REST</text><text x="910" y="156" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Identity keys on disk</text><rect x="872" y="184" width="272" height="72" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><text x="890" y="214" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Windows</text><text x="890" y="236" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Protected by Windows DPAPI.</text><rect x="872" y="270" width="272" height="104" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><text x="890" y="300" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">macOS · Linux</text><text x="890" y="322" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Stored in user-only files.</text><rect x="890" y="334" width="198" height="26" rx="13.0" fill="#16211c" stroke="#a3b398" stroke-width="1.2" stroke-dasharray="3 3"/><text x="902" y="351.5" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Keychain support planned</text><rect x="852" y="408" width="312" height="214" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(874 429) scale(1.0000)" fill="none" stroke="#2dd4bf" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.4-7.5 9.5-4.3-1.1-7.5-4.9-7.5-9.5V6z"/></g><text x="910" y="447" fill="#2dd4bf" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">WHO GETS THROUGH</text><g transform="translate(874 470) scale(0.8333)" fill="none" stroke="#f2b0a6" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></g><text x="906" y="484" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Outside your tailnet</text><text x="906" y="503" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Cannot reach port 47832.</text><g transform="translate(874 519) scale(0.8333)" fill="none" stroke="#f2b0a6" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></g><text x="906" y="533" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">In your tailnet, not paired</text><text x="906" y="552" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Refused: no pinned certificate.</text><g transform="translate(874 568) scale(0.8333)" fill="none" stroke="#2dd4bf" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.7 2.7L16 9.6"/></g><text x="906" y="582" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Paired device</text><text x="906" y="601" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Only what its grants allow.</text><rect x="36" y="642" width="1128" height="56" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(56 658) scale(0.9167)" fill="none" stroke="#e3cd8f" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.01"/></g><text x="88" y="675" fill="#e3cd8f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">HONEST LIMITS</text><circle cx="234.5" cy="670" r="3" fill="#a3b398"/><text x="246.5" y="675" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Not post-quantum in practice</text><circle cx="555.025" cy="670" r="3" fill="#a3b398"/><text x="567.025" y="675" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Doesn't protect a compromised computer</text><circle cx="949.8" cy="670" r="3" fill="#a3b398"/><text x="961.8" y="675" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start">No independent audit yet</text>
</svg>
