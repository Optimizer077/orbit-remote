<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" role="img" aria-labelledby="t d">
  <title id="t">How Orbit Remote connects your computers</title>
  <desc id="d">Your computer's Orbit app talks to the remote computer through two encryption layers: Tailscale WireGuard and, inside it, Orbit mutual TLS. The host checks link policy, identity, permissions, and session before reaching the desktop.</desc>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="tail" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="656" rx="22" fill="#101616"/>
  <text x="36" y="48" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">How a connection works</text><text x="36" y="74" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Every request crosses two encryption layers and four checks on the host.</text><rect x="36" y="100" width="300" height="470" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(54.35483870967742 118.35483870967742) scale(0.04032258064516129)"><g fill="none" stroke="#b2e6c5" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#b2e6c5"/><circle cx="791.86" cy="337.13" r="40" fill="#b2e6c5"/></g><text x="102" y="136" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.4">YOUR COMPUTER</text><text x="102" y="156" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Viewer</text><rect x="56" y="184" width="260" height="92" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><text x="74" y="216" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Orbit window</text><text x="74" y="240" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Sandboxed. Never holds keys</text><text x="74" y="260" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">or sockets.</text><line x1="186.0" y1="280" x2="186.0" y2="322" stroke="#a3b398" stroke-width="2" marker-end="url(#head)"/><text x="196.0" y="306" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">allow-listed actions</text><rect x="56" y="326" width="260" height="112" rx="12" fill="#1d2b23" stroke="#b2e6c5" stroke-width="2"/><text x="74" y="358" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Orbit main process</text><text x="74" y="382" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Holds this computer's key</text><text x="74" y="402" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Checks the host's pin + cipher</text><text x="74" y="422" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">before sending one byte</text><rect x="56" y="460" width="260" height="88" rx="12" fill="#3a321b" stroke="#e3cd8f" stroke-width="1.5"/><text x="74" y="488" fill="#e3cd8f" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.3">SECURITY CODE</text><text x="74" y="512" fill="#eceee7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">551F 68EA 65A3 120A …</text><text x="74" y="534" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Matches on both computers</text><rect x="372" y="214" width="456" height="252" rx="26" fill="#16233a" stroke="#aecaff" stroke-width="2" stroke-dasharray="7 6"/><g fill="none" stroke="#aecaff" stroke-width="2" stroke-linecap="round"><rect x="394" y="239" width="14" height="11" rx="2.5"/><path d="M397.5 239V236.5a3.5 3.5 0 0 1 7 0V239"/></g><text x="418" y="248" fill="#aecaff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="1.2">LAYER 1 · TAILSCALE WIREGUARD</text><text x="394" y="272" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Only your tailnet devices can reach the host.</text><text x="394" y="291" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Curve25519 · ChaCha20-Poly1305 · relays see ciphertext</text><rect x="390" y="312" width="420" height="136" rx="20" fill="#1e3a2b" stroke="#b2e6c5" stroke-width="2"/><g fill="none" stroke="#b2e6c5" stroke-width="2" stroke-linecap="round"><rect x="408" y="335" width="14" height="11" rx="2.5"/><path d="M411.5 335V332.5a3.5 3.5 0 0 1 7 0V335"/></g><text x="432" y="344" fill="#b2e6c5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="1.2">LAYER 2 · ORBIT MUTUAL TLS</text><text x="408" y="370" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">TLS 1.3 · AES-256-GCM · X25519</text><text x="408" y="392" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Forward secrecy. Weaker links refused</text><text x="408" y="411" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">by both sides. Certificates pinned.</text><rect x="864" y="100" width="300" height="470" rx="18" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(882.3548387096774 118.35483870967742) scale(0.04032258064516129)"><g fill="none" stroke="#b2e6c5" stroke-width="34"><circle cx="512" cy="512" r="220"/><ellipse cx="512" cy="512" rx="330" ry="122" transform="rotate(-32 512 512)"/></g><circle cx="512" cy="512" r="70" fill="#b2e6c5"/><circle cx="791.86" cy="337.13" r="40" fill="#b2e6c5"/></g><text x="930" y="136" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.4">REMOTE COMPUTER</text><text x="930" y="156" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Host</text><rect x="884" y="182" width="260" height="60" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="910" cy="212" r="14" fill="#b2e6c5"/><text x="910" y="217" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="936" y="208" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Link policy</text><text x="936" y="228" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Weak TLS dropped first</text><rect x="884" y="252" width="260" height="60" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="910" cy="282" r="14" fill="#b2e6c5"/><text x="910" y="287" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="936" y="278" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Identity</text><text x="936" y="298" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Pinned certificate + tailnet source</text><rect x="884" y="322" width="260" height="60" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="910" cy="352" r="14" fill="#b2e6c5"/><text x="910" y="357" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="936" y="348" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Permissions</text><text x="936" y="368" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Only what the owner granted</text><rect x="884" y="392" width="260" height="60" rx="12" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><circle cx="910" cy="422" r="14" fill="#b2e6c5"/><text x="910" y="427" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="936" y="418" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Session</text><text x="936" y="438" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">One controller · revocable</text><line x1="1014.0" y1="456" x2="1014.0" y2="476" stroke="#a3b398" stroke-width="2" marker-end="url(#head)"/><rect x="884" y="480" width="260" height="72" rx="12" fill="#1e3a2b" stroke="#b2e6c5" stroke-width="1.5"/><text x="902" y="508" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Your existing desktop</text><text x="902" y="530" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Screen · input · clipboard · files</text><line x1="338" y1="335" x2="386" y2="335" stroke="#a3b398" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><line x1="814" y1="335" x2="862" y2="335" stroke="#a3b398" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="36.0" y="592" width="366.6666666666667" height="40" rx="20" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="58.0" cy="612" r="5" fill="#b2e6c5"/><text x="72.0" y="617" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">No Orbit server or account</text><rect x="416.6666666666667" y="592" width="366.6666666666667" height="40" rx="20" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="438.6666666666667" cy="612" r="5" fill="#b2e6c5"/><text x="452.6666666666667" y="617" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Encrypted twice, end to end</text><rect x="797.3333333333334" y="592" width="366.6666666666667" height="40" rx="20" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><circle cx="819.3333333333334" cy="612" r="5" fill="#b2e6c5"/><text x="833.3333333333334" y="617" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Your grants, your revocation</text>
</svg>
