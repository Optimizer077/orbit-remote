<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1064" viewBox="0 0 600 1064" role="img" aria-labelledby="t d">
  <title id="t">Pairing two Orbit Remote computers</title>
  <desc id="d">Pairing happens once per direction. 1: on the host, choose Invite a computer and pick its grants; view only is the default. 2: the host creates an invitation with its address, certificate fingerprint and a one-time secret; it expires in 5 minutes and works once. 3: you send it privately to the viewer. 4: the viewer chooses Join with an invite, pastes it, connects, and checks that the host certificate matches the fingerprint before sending the secret. 5: the host verifies the secret and stores the viewer's certificate pin and grants. 6: both screens show the same security code, compared once. If an invitation leaks and someone else pairs first, the codes will not match.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f6349" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#4f6349" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#00756a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#00756a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#2b5aa6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#2b5aa6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#86651a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#86651a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a2392b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a2392b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="1064" rx="22" fill="#ffffff"/>
  <text x="24" y="44" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Pairing: once per direction</text><text x="24" y="70" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Once for each computer you want to view.</text><text x="24" y="90" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Viewing the other way needs its own invitation.</text><rect x="24" y="114" width="227" height="26" rx="13.0" fill="#ccf2eb" stroke="#00756a" stroke-width="1.2"/><text x="36" y="131.5" fill="#00756a" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Host = the computer you view</text><rect x="263" y="114" width="219.75" height="26" rx="13.0" fill="#e3ecfb" stroke="#2b5aa6" stroke-width="1.2"/><text x="275" y="131.5" fill="#2b5aa6" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Viewer = the one you sit at</text><rect x="24" y="162" width="552" height="76" rx="14" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="54" cy="190" r="14" fill="#00756a"/><text x="54" y="195" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="82" y="195" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" text-anchor="start">Invite a computer</text><text x="556" y="194" fill="#00756a" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.3">HOST</text><text x="82" y="220" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Pick its grants. View only is the default.</text><line x1="300" y1="240" x2="300" y2="266" stroke="#4f6349" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><rect x="24" y="268" width="552" height="137" rx="14" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="54" cy="296" r="14" fill="#00756a"/><text x="54" y="301" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="82" y="301" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" text-anchor="start">Create an invitation</text><text x="556" y="300" fill="#00756a" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.3">HOST</text><text x="82" y="326" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Holds the host address, certificate</text><text x="82" y="347" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">fingerprint and a one-time secret.</text><rect x="82" y="361" width="285.25" height="26" rx="13.0" fill="#f6ecd2" stroke="#86651a" stroke-width="1.2"/><g transform="translate(92 366) scale(0.6667)" fill="none" stroke="#86651a" stroke-width="2.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g><text x="116" y="378.5" fill="#86651a" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Expires in 5 minutes · works once</text><line x1="300" y1="407" x2="300" y2="475" stroke="#4f6349" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><rect x="186.785" y="424" width="226.43" height="34" rx="17" fill="#f6f6f1" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="212.785" cy="441" r="12" fill="#4f6349"/><text x="212.785" y="446" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="232.785" y="446" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">You send it privately</text><rect x="24" y="477" width="552" height="118" rx="14" fill="#ffffff" stroke="#2b5aa6" stroke-width="2"/><circle cx="54" cy="505" r="14" fill="#2b5aa6"/><text x="54" y="510" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="82" y="510" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" text-anchor="start">Join with an invite</text><text x="556" y="509" fill="#2b5aa6" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.3">VIEWER</text><text x="82" y="535" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Connects and checks the host</text><text x="82" y="556" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">certificate against the fingerprint.</text><text x="82" y="577" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">The secret is sent only after they match.</text><line x1="300" y1="597" x2="300" y2="665" stroke="#00756a" stroke-width="2" stroke-linecap="round" marker-end="url(#h-mint)"/><rect x="181.955" y="614" width="236.09" height="34" rx="17" fill="#f6f6f1" stroke="#00756a" stroke-width="1.5"/><g transform="translate(195.955 622) scale(0.7500)" fill="none" stroke="#00756a" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></g><text x="221.955" y="636" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Secret, over pinned TLS</text><rect x="24" y="667" width="552" height="97" rx="14" fill="#ffffff" stroke="#d5ddcd" stroke-width="1.5"/><circle cx="54" cy="695" r="14" fill="#00756a"/><text x="54" y="700" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="82" y="700" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" text-anchor="start">Verify and remember</text><text x="556" y="699" fill="#00756a" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.3">HOST</text><text x="82" y="725" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Checks the secret, then stores the</text><text x="82" y="746" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">viewer's certificate pin and its grants.</text><line x1="300" y1="766" x2="300" y2="792" stroke="#4f6349" stroke-width="2" stroke-linecap="round" marker-end="url(#h-muted)"/><rect x="24" y="794" width="552" height="154" rx="16" fill="#f6ecd2" stroke="#86651a" stroke-width="1.5"/><circle cx="54" cy="822" r="14" fill="#86651a"/><text x="54" y="827" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="82" y="827" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" text-anchor="start">Compare the security code once</text><text x="82" y="852" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Both screens show the same code.</text><rect x="44" y="870" width="248" height="58" rx="12" fill="#ffffff" stroke="#86651a" stroke-width="1.2"/><text x="60" y="892" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">HOST SHOWS</text><text x="60" y="915" fill="#1f2d23" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14.5" font-weight="600" text-anchor="start">551F 68EA 65A3 120A …</text><rect x="308" y="870" width="248" height="58" rx="12" fill="#ffffff" stroke="#86651a" stroke-width="1.2"/><text x="324" y="892" fill="#4f6349" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">VIEWER SHOWS</text><text x="324" y="915" fill="#1f2d23" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14.5" font-weight="600" text-anchor="start">551F 68EA 65A3 120A …</text><rect x="24" y="964" width="552" height="72" rx="14" fill="#fbe8e4" stroke="#a2392b" stroke-width="1.5"/><g transform="translate(42 980) scale(1.0000)" fill="none" stroke="#a2392b" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.01"/></g><text x="78" y="995" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Swapped invite?</text><text x="78" y="1017" fill="#1f2d23" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">If its host details were changed, the codes won't match.</text>
</svg>
