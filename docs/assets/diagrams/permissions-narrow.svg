<svg xmlns="http://www.w3.org/2000/svg" width="600" height="826" viewBox="0 0 600 826" role="img" aria-labelledby="t d">
  <title id="t">Orbit Remote device permissions</title>
  <desc id="d">Five grants a host owner can give a paired device: View, the default for new invitations; Control of mouse and keyboard; Clipboard; Files; and Power to lock or restart. Rules: Control also needs Take control on the viewer; Power requires Control; Files are limited to one shared folder, 16 MiB and no overwrite; the host owner can revoke access at any time.</desc>
  <defs>
    <marker id="h-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-muted" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#a3b398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-mint" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-blue" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#aecaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#e3cd8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="h-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t-rose" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1L2 5L9 9" fill="none" stroke="#f2b0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="826" rx="22" fill="#101616"/>
  <text x="24" y="44" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">What a paired device can do</text><text x="24" y="70" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">The host owner chooses grants for each device.</text><text x="24" y="90" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">New invitations start view-only.</text><rect x="24" y="116" width="552" height="80" rx="16" fill="#16211c" stroke="#b2e6c5" stroke-width="2"/><rect x="40" y="130" width="52" height="52" rx="14" fill="#1e3a2b" stroke="#b2e6c5" stroke-width="1.5"/><g transform="translate(52 142) scale(1.1667)" fill="none" stroke="#b2e6c5" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text x="110" y="151" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">View</text><text x="110" y="174" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">See the host's screen live.</text><rect x="477.2" y="134" width="78.8" height="24" rx="12" fill="#b2e6c5" stroke="#b2e6c5" stroke-width="1"/><text x="516.6" y="150.5" fill="#101616" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">DEFAULT</text><rect x="24" y="208" width="552" height="80" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="40" y="222" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(52 234) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 6.5v3.5"/></g><text x="110" y="243" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Control</text><text x="110" y="266" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Use the host's mouse and keyboard.</text><rect x="24" y="300" width="552" height="80" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="40" y="314" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(52 326) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="17" rx="2.5"/><rect x="8.5" y="2.5" width="7" height="4" rx="1.5"/><path d="M8.5 11.5h7M8.5 15.5h4.5"/></g><text x="110" y="335" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Clipboard</text><text x="110" y="358" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Copy and paste between the two computers.</text><rect x="24" y="392" width="552" height="80" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="40" y="406" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(52 418) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><text x="110" y="427" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Files</text><text x="110" y="450" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Move files through one shared folder.</text><rect x="24" y="484" width="552" height="80" rx="16" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><rect x="40" y="498" width="52" height="52" rx="14" fill="#16211c" stroke="#33463a" stroke-width="1.5"/><g transform="translate(52 510) scale(1.1667)" fill="none" stroke="#eceee7" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8.5"/><path d="M7.2 6.4a7.6 7.6 0 1 0 9.6 0"/></g><text x="110" y="519" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Power</text><text x="110" y="542" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Lock or restart the host.</text><text x="24" y="594" fill="#a3b398" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">RULES</text><rect x="24" y="608" width="552" height="190" rx="16" fill="#1d2b23" stroke="#33463a" stroke-width="1.5"/><g transform="translate(40 631) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></g><text x="72" y="646" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Control also needs Take control on the viewer.</text><g transform="translate(40 673) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8.5"/><path d="M7.2 6.4a7.6 7.6 0 1 0 9.6 0"/></g><text x="72" y="688" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Power requires Control.</text><g transform="translate(40 715) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><text x="72" y="730" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Files: one shared folder, 16 MiB limit, no overwrite.</text><g transform="translate(40 757) scale(0.8333)" fill="none" stroke="#a3b398" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></g><text x="72" y="772" fill="#eceee7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">The host owner can revoke access at any time.</text>
</svg>
