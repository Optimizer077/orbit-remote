<svg xmlns="http://www.w3.org/2000/svg" width="390" height="520" viewBox="0 0 390 520" role="img" aria-labelledby="title desc"><title id="title">Orbit connection architecture</title><desc id="desc">Your computer connects over Tailscale to an explicitly paired remote computer. Each device can be a viewer and a host. Development preview; the decorative flow is not live connection status.</desc><defs><linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#18291f"/><stop offset="1" stop-color="#101521"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="4" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L4 3L1 5" fill="none" stroke="#91b69a" stroke-width="1.5" stroke-linecap="round"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.packet{fill:#b2e6c5;opacity:0;animation:none}.late{animation-delay:-3s}@keyframes flow{0%,10%{transform:translateX(0);opacity:0}24%,75%{opacity:.85}90%,100%{transform:translateY(48px);opacity:0}}@media(prefers-reduced-motion:reduce){.packet{animation:none;opacity:0}}</style><rect x="1" y="1" width="388" height="518" rx="18" fill="url(#surface)" stroke="#3a5140"/><rect x="24" y="24" width="342" height="100" rx="12" fill="#17261e" stroke="#45604a"/><g transform="translate(44 41)" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round"><rect width="27" height="19" rx="3"/><path d="M13.5 19V25M7 25H20M6 7H14M6 11H20"/></g><text x="86" y="62" fill="#eef2e9" font-size="21" font-weight="600">Your computer</text><text x="44" y="90" fill="#b2e6c5" font-size="15">Viewer + host</text><text x="44" y="111" fill="#b2c3ad" font-size="15">Your local identity and access.</text><rect x="24" y="184" width="342" height="100" rx="12" fill="#17261e" stroke="#45604a"/><g transform="translate(44 201)" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round"><rect x="1" y="9" width="24" height="19" rx="4"/><path d="M6 9V6A7 7 0 0 1 20 6V9M13 16V21"/></g><text x="86" y="222" fill="#eef2e9" font-size="21" font-weight="600">Tailscale network</text><text x="44" y="250" fill="#b2e6c5" font-size="15">Encrypted network path</text><text x="44" y="271" fill="#b2c3ad" font-size="15">Orbit checks device permissions.</text><rect x="24" y="344" width="342" height="100" rx="12" fill="#17261e" stroke="#45604a"/><g transform="translate(44 361)" fill="none" stroke="#b2e6c5" stroke-width="1.8" stroke-linecap="round"><rect width="27" height="19" rx="3"/><path d="M13.5 19V25M7 25H20M6 7H14M6 11H20"/></g><text x="86" y="382" fill="#eef2e9" font-size="21" font-weight="600">Remote computer</text><text x="44" y="410" fill="#b2e6c5" font-size="15">Viewer + host</text><text x="44" y="431" fill="#b2c3ad" font-size="15">An explicitly paired device.</text><g fill="none" stroke="#91b69a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M195 132V176"/><path d="M195 292V336"/></g><text x="24" y="477" fill="#b2c3ad" font-size="14">Development preview &#183; Illustrative architecture.</text><text x="24" y="499" fill="#b2c3ad" font-size="14">Decorative flow, not live connection status.</text></svg>
